name: Test and package portable app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Package portable app
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SNES-ROM-Investigator-0.1.0
          path: |
            portable/SNES-ROM-Investigator.html
            SNES-ROM-Investigator-0.1.0.zip
            .test-output/*.png
          if-no-files-found: warn
